<style>
:root{
  --fondo:#0E1721;
  --superficie:#16232F;
  --superficie-alta:#1C2E3D;
  --linea:#24384A;
  --texto:#EAF1F6;

html{font-size:clamp(10px,1.15vh,28px)}

body{
  background:var(--fondo);

/* ── Estructura ─────────────────────────────────────────── */
.tablero{height:100vh;display:grid;grid-template-rows:7.5vh 1fr;gap:1.1vh;padding:1.5vh 1.6vw}

/* ── Panel de mercado ───────────────────────────────────── */

   tarjeta blanca deliberada en vez de dejarlo flotando sobre el fondo. */

.caja-mercado{
  min-height:0;overflow:hidden;
  background:#FFFFFF;border-radius:.4rem;
  display:flex;align-items:stretch;justify-content:center;
}
.caja-grafico{flex:16}
.caja-spot{flex:11}
.caja-mercado .aviso{font-size:1.3rem;color:#5A6B7A;text-align:center;padding:0 1vw;margin:auto}

.cuerpo{

  grid-template-columns:22% 1fr 1fr 440px;
  grid-template-rows:53% 1fr;
  gap:1.3vh 1.2vw;
  min-height:0;
}
.p-consolidado{grid-column:1;grid-row:1/3}
.p-traders    {grid-column:2;grid-row:1}

.cabecera{display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid var(--linea);padding-bottom:.9vh}

.hoy{position:absolute;top:0;bottom:0;width:2px;background:var(--cobre-claro);opacity:.75}

<script>
/* ════════════════════════════════════════════════════════════════
   1. Lectura del Sheet publicado
   ════════════════════════════════════════════════════════════════ */
/* ════════════════════════════════════════════════════════════════
   1. Lectura del Sheet: tres vías, en orden
      A. CSV publicado  → sirve cuando la página está alojada en http/https
      B. JSONP a gviz   → sirve incluso abriendo el archivo con doble clic
      C. Respaldo local → última foto conocida, para que la pantalla no quede vacía
   ════════════════════════════════════════════════════════════════ */
let origenDatos = "";

async function viaCSV(){
  const url = CONFIG.URL_MAESTRO + (CONFIG.URL_MAESTRO.includes("?") ? "&" : "?") + "t=" + Date.now();
  const r = await fetch(url);
  if(!r.ok) throw new Error("HTTP " + r.status);
  const txt = await r.text();
  if(/^\s*</.test(txt)) throw new Error("respuesta no es CSV");
  return parseCSV(txt);
}

/* Un <script> no está sujeto a las reglas de origen cruzado, así que esta vía
   funciona desde file://. A cambio exige permiso de lectura sobre el archivo. */
function viaJSONP(){
  return new Promise((resolve,reject)=>{
    if(!CONFIG.SHEET_ID) return reject(new Error("sin SHEET_ID"));
    const cb = "ennex_" + Date.now();
    const s = document.createElement("script");
    const limpiar = ()=>{ delete window[cb]; s.remove(); clearTimeout(reloj); };
    const reloj = setTimeout(()=>{ limpiar(); reject(new Error("tiempo agotado")); }, 12000);

    window[cb] = resp=>{
      limpiar();
      try{
        const t = resp.table;
        const cab = t.cols.map(c=>(c.label||c.id||"").toLowerCase().trim()
          .normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]/g,""));
        resolve(t.rows.map(fila=>{
          const o={};
          cab.forEach((k,i)=>{
            if(!k || o[k]!==undefined) return;
            const c = fila.c && fila.c[i];
            o[k] = c ? String(c.f ?? c.v ?? "").trim() : "";
          });
          return o;
        }));
      }catch(e){ reject(e); }
    };

    s.onerror = ()=>{ limpiar(); reject(new Error("sin acceso de lectura")); };
    s.src = "https://docs.google.com/spreadsheets/d/" + CONFIG.SHEET_ID +
            "/gviz/tq?tqx=out:json;responseHandler=" + cb +
            "&gid=" + CONFIG.HOJA_GID + "&t=" + Date.now();
    document.head.appendChild(s);
  });
}

async function traerMaestro(){
  try{ const f = await viaCSV();   if(f.length){ origenDatos="csv";   return f; } }catch(e){ console.warn("CSV:",e.message); }
  try{ const f = await viaJSONP(); if(f.length){ origenDatos="jsonp"; return f; } }catch(e){ console.warn("JSONP:",e.message); }
  origenDatos="fallo";
  throw new Error("no se pudo leer el Sheet por ninguna vía");
}

const clave = s => String(s).toLowerCase().trim().normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]/g,"");

/* Devuelve la hoja como filas crudas (array de arrays) */
function parseCSVFilas(txt){
  const filas=[]; let campo="", fila=[], comillas=false;
  txt = txt.replace(/\r\n/g,"\n").replace(/\r/g,"\n");
  for(let i=0;i<txt.length;i++){
    const c=txt[i];
    if(comillas){
      if(c==='"'){ if(txt[i+1]==='"'){campo+='"';i++;} else comillas=false; }
      else campo+=c;
    }else{
      if(c==='"') comillas=true;
      else if(c===","){ fila.push(campo); campo=""; }
      else if(c==="\n"){ fila.push(campo); filas.push(fila); fila=[]; campo=""; }
      else campo+=c;
    }
  }
  if(campo||fila.length){ fila.push(campo); filas.push(fila); }
  return filas;
}

/* Devuelve la hoja como objetos, tomando la primera fila como encabezado */
function parseCSV(txt){
  const filas=parseCSVFilas(txt);
  if(!filas.length) return [];
  const cab = filas[0].map(clave);
  return filas.slice(1).map(f=>{
    const o={}; cab.forEach((k,i)=>{ if(k && o[k]===undefined) o[k]=(f[i]??"").trim(); });
    return o;
  });
}

const MES={ene:0,feb:1,mar:2,abr:3,may:4,jun:5,jul:6,ago:7,sep:8,set:8,oct:9,nov:10,dic:11};
const MESES=["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Set","Oct","Nov","Dic"];

function num(v){
  if(typeof v==="number") return v;
  let s=String(v).replace(/[^\d.,\-]/g,"").trim();
  if(!s||s==="-") return 0;
  const up=s.lastIndexOf("."), uc=s.lastIndexOf(",");
  if(up>-1&&uc>-1) s = uc>up ? s.replace(/\./g,"").replace(",",".") : s.replace(/,/g,"");
  else if(uc>-1)   s = /,\d{1,2}$/.test(s) ? s.replace(",",".") : s.replace(/,/g,"");
  const n=parseFloat(s); return isNaN(n)?0:n;
}

/* "2-ene" toma el año del código de lote; "6/1/2026" trae el año propio */
function fecha(v, anio, mesLote){
  const s=String(v||"").trim();
  if(!s || /^x+$/i.test(s)) return null;
  let m=s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/);
  if(m){ let a=+m[3]; if(a<100) a+=2000; return new Date(a,+m[2]-1,+m[1]); }
  m=s.match(/^(\d{1,2})-([a-zA-Záéíóú]{3,4})\.?$/);
  if(m){
    const mi=MES[m[2].toLowerCase().slice(0,3).normalize("NFD").replace(/[\u0300-\u036f]/g,"")];
    if(mi===undefined) return null;
    let a = anio || new Date().getFullYear();
    if(mesLote!==undefined && mi < mesLote-6) a++;   // cruce de año
    return new Date(a,mi,+m[1]);
  }
  const d=new Date(s); return isNaN(d)?null:d;
}

/* ════════════════════════════════════════════════════════════════
   2. Modelo: una fila maestra por lote (código de 8 dígitos)
   ════════════════════════════════════════════════════════════════ */
function armarLotes(filas){
  const hoy=new Date(); hoy.setHours(0,0,0,0);
  return filas.map(r=>{
    const cod=(r.lote||"").trim();
    const m=cod.match(/^(\d{4})(\d{2})(\d{2})/);
    if(!m) return null;
    const anio=+m[1], mesLote=+m[2]-1;

    const entrega = fecha(r.fechaentrega, anio, mesLote);
    const reporte = fecha(r.fechadereporte, anio, mesLote);
    const lp      = fecha(r.fechadelp, anio, mesLote);
    const lf      = fecha(r.fechadelf, anio, mesLote);

    const tmh = num(r.tmhllegada) || num(r.tmhsalida) || num(r.tmhcompra);
    const tms = num(r.tmsllegada) || num(r.tmscompra);
    const ley = num(r.cufinal) || num(r.cucompra);

    let estado;
    if(entrega && entrega>hoy)      estado="programado";
    else if(lf)                     estado="cerrado";
    else if(entrega && !reporte && (hoy-entrega)/864e5 > (CONFIG.DIAS_ALERTA||45)) estado="demorado";
    else                            estado="proceso";

    return {
      cod, anio, tmh, tms, ley,
      trader:  (r.trader||"").trim() || "Sin trader",
      producto:(r.producto||"").trim() || "—",
      origen:  (r.origen||"").trim(),
      factura: (r.factura||"").trim(),
      entrega, reporte, lp, lf, estado
    };
  }).filter(l=>l && l.tmh>0);
}

/* ════════════════════════════════════════════════════════════════
   3. Formato
   ════════════════════════════════════════════════════════════════ */
const fmt = (n,d=0)=> n.toLocaleString("es-PE",{minimumFractionDigits:d,maximumFractionDigits:d});
const dia = d => d.getDate()+" "+MESES[d.getMonth()].toLowerCase();
const esc = s => String(s).replace(/[<>&]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;"}[c]));

/* ════════════════════════════════════════════════════════════════
   4. Pintado
   ════════════════════════════════════════════════════════════════ */
const COLOR_PROD={Cu:"var(--cobre)",Ag:"var(--plata)",Pb:"var(--plomo)",Zn:"var(--malaquita)"};

function pintarConsolidado(entregadas, programados){
  const total = entregadas.reduce((s,l)=>s+l.tmh,0);
  const hoy=new Date();

  document.getElementById("tmh-total").innerHTML = fmt(total,1)+"<small>TMH</small>";
  document.getElementById("periodo").textContent = CONFIG.PERIODO;

  // Medidor: mes en curso contra la meta mensual
  const delMes = entregadas.filter(l=>l.entrega && l.entrega.getMonth()===hoy.getMonth() && l.entrega.getFullYear()===hoy.getFullYear());
  const tmhMes = delMes.reduce((s,l)=>s+l.tmh,0);
  const meta   = CONFIG.META_MES||0;
  const pct    = meta ? Math.min(tmhMes/meta*100,100) : 0;

  document.getElementById("medidor-mes").textContent =
    MESES[hoy.getMonth()].toLowerCase()+": "+fmt(tmhMes,0)+" TMH ("+fmt(pct,0)+"%)";
  document.getElementById("medidor-meta").textContent = fmt(meta);
  requestAnimationFrame(()=>{ document.getElementById("medidor-fill").style.width = pct+"%"; });

  // Cumplimiento contra la meta acumulada de los meses ya cerrados
  const meses = new Set(entregadas.filter(l=>l.entrega).map(l=>l.entrega.getMonth()));
  meses.delete(hoy.getMonth());
  const metaAcum = meses.size*meta;
  const totalCerrado = entregadas.filter(l=>l.entrega && !(l.entrega.getMonth()===hoy.getMonth() && l.entrega.getFullYear()===hoy.getFullYear()))
                                 .reduce((s,l)=>s+l.tmh,0);
  const cump = metaAcum ? totalCerrado/metaAcum*100 : 0;

  const cu = entregadas.filter(l=>l.producto==="Cu" && l.ley>0 && l.tms>0);
  const ley = cu.length ? cu.reduce((s,l)=>s+l.ley*l.tms,0)/cu.reduce((s,l)=>s+l.tms,0) : 0;

  document.getElementById("k-lotes").textContent = entregadas.length;
  document.getElementById("k-cump").textContent  = metaAcum ? fmt(cump,0)+"%" : "—";
  document.getElementById("k-ley").textContent   = ley ? fmt(ley,1)+"%" : "—";

  const tp = programados.reduce((s,l)=>s+l.tmh,0);
  document.getElementById("tmh-pie").textContent = tp
    ? programados.length+" lote"+(programados.length>1?"s":"")+" programado por "+fmt(tp,0)+" TMH"
    : "Sin lotes programados pendientes";

  // Mezcla por producto
  const mapa=new Map();
  entregadas.forEach(l=>mapa.set(l.producto,(mapa.get(l.producto)||0)+l.tmh));
  const lista=[...mapa.entries()].sort((a,b)=>b[1]-a[1]);
  const tope=lista.length?lista[0][1]:1;
  document.getElementById("mezcla").innerHTML = lista.map(([p,v])=>`
    <div class="fila-prod">
      <div class="sim">${esc(p)}</div>
      <div class="pista"><i data-w="${(v/tope*100).toFixed(1)}" style="background:${COLOR_PROD[p]||"var(--zinc)"}"></i></div>
      <div class="v num">${fmt(v,0)}</div>
    </div>`).join("");
}

/* En el maestro la columna Origen distingue mineral de Progreso (planta
   propia) del comprado en Acopio. */
const COLOR_ORIGEN={Progreso:"var(--cobre)",Acopio:"var(--plomo)"};

function normOrigen(v){
  const s=String(v||"").trim().toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  if(s.startsWith("prog")) return "Progreso";
  if(s.startsWith("acop")) return "Acopio";
  return s ? s[0].toUpperCase()+s.slice(1) : "Sin origen";
}

function pintarProcedencia(entregadas){
  const cont=document.getElementById("lista-procedencia");
  const mapa=new Map();
  entregadas.forEach(l=>{
    const k=normOrigen(l.origen);
    const t=mapa.get(k)||{tmh:0,lotes:0,prod:new Set()};
    t.tmh+=l.tmh; t.lotes++; t.prod.add(l.producto); mapa.set(k,t);
  });
  const total=entregadas.reduce((s,l)=>s+l.tmh,0)||1;
  const orden=["Progreso","Acopio"];
  const lista=[...mapa.entries()].sort((a,b)=>{
    const ia=orden.indexOf(a[0]), ib=orden.indexOf(b[0]);
    if(ia>-1||ib>-1) return (ia<0?9:ia)-(ib<0?9:ib);
    return b[1].tmh-a[1].tmh;
  });
  document.getElementById("proc-nota").textContent = lista.length+" procedencias";

  if(!lista.length){
    cont.innerHTML='<div class="vacio"><b>Sin entregas registradas</b>Revisa la columna Origen del maestro</div>';
    return;
  }
  const tope=Math.max(...lista.map(l=>l[1].tmh))||1;
  cont.innerHTML = lista.map(([n,t])=>`
    <div class="fila-trader">
      <div class="top">
        <div class="nombre">${esc(n)}</div>
        <div class="cifras"><b class="num">${fmt(t.tmh,0)}</b><span>${fmt(t.tmh/total*100,1)}%</span></div>
      </div>
      <div class="pista"><i data-w="${(t.tmh/tope*100).toFixed(1)}" style="background:${COLOR_ORIGEN[n]||"var(--zinc)"}"></i></div>
      <div class="sub">${t.lotes} lotes · ${[...t.prod].join(", ")}</div>
    </div>`).join("");
}

function pintarMeses(entregadas){
  const cont=document.getElementById("barras-mes");
  const hoy=new Date();
  const mapa=new Map();
  entregadas.forEach(l=>{
    if(!l.entrega) return;
    const k=l.entrega.getMonth();
    const m=mapa.get(k)||{P:0,A:0,T:0};
    const o=normOrigen(l.origen);
    if(o==="Acopio") m.A+=l.tmh; else m.P+=l.tmh;
    m.T+=l.tmh; mapa.set(k,m);
  });
  if(!mapa.size){ cont.innerHTML='<div class="vacio">Sin fechas de entrega legibles</div>'; return; }

  const meses=[...mapa.keys()].sort((a,b)=>a-b);
  const serie=[]; for(let m=meses[0];m<=meses[meses.length-1];m++) serie.push([m,mapa.get(m)||{P:0,A:0,T:0}]);
  const meta=CONFIG.META_MES||0;
  const tope=Math.max(...serie.map(s=>s[1].T), meta)*1.15||1;

  cont.style.gridTemplateColumns="repeat("+serie.length+",1fr)";
  cont.innerHTML =
    serie.map(([m,d],i)=>{
      const alto=(d.T/tope*100).toFixed(1);
      const pAcopio=d.T ? (d.A/d.T*100).toFixed(1) : 0;
      return `<div class="mes-bar ${m===hoy.getMonth()?"actual":""}" style="grid-column:${i+1}">
        <div class="v num">${fmt(d.T,0)}</div>
        <div class="col" data-h="${alto}">
          <div class="seg acopio" style="height:${pAcopio}%"></div>
          <div class="seg progreso"></div>
        </div>
      </div>`;
    }).join("")
    + (meta ? `<div class="capa-meta"><div class="linea-meta" style="bottom:${(meta/tope*100).toFixed(1)}%"><span>meta ${fmt(meta)}</span></div></div>` : "")
    + serie.map(([m,d],i)=>`
      <div class="mes-lab" style="grid-column:${i+1}">
        <div class="k">${MESES[m]}</div>
        <div class="dd"><span class="pp num">${fmt(d.P,0)}</span><span class="aa num">${d.A?fmt(d.A,0):"–"}</span></div>
      </div>`).join("");

  requestAnimationFrame(()=>{
    cont.querySelectorAll(".col").forEach(c=>{ c.style.height=c.dataset.h+"%"; });
  });
}

/* ════════════════════════════════════════════════════════════════
   Programa de procesos de planta
   La hoja no empieza en A1: el encabezado real está unas filas más
   abajo y desplazado a la derecha, así que se localiza por su texto.
   ════════════════════════════════════════════════════════════════ */
async function traerProcesos(){
  const url = CONFIG.URL_PROCESOS + (CONFIG.URL_PROCESOS.includes("?") ? "&" : "?") + "t=" + Date.now();
  const r = await fetch(url);
  if(!r.ok) throw new Error("HTTP " + r.status);
  const txt = await r.text();
  if(/^\s*</.test(txt)) throw new Error("respuesta no es CSV");
  return armarProcesos(parseCSVFilas(txt));
}

function armarProcesos(filas){
  const iCab = filas.findIndex(f => f.some(c => /proveedordemineral/.test(clave(c))));
  if(iCab < 0) throw new Error("no se encontró la fila de encabezados");

  const cab = filas[iCab].map(clave);
  const buscar = (...pats) => {
    for(const p of pats){ const i = cab.findIndex(k => k.includes(p)); if(i > -1) return i; }
    return -1;
  };
  const iProv = buscar("proveedor"), iTipo = buscar("tipo"),
        iStock = buscar("stockprogramado","stock"), iLey = buscar("ley"),
        iIni = buscar("iniciodeproceso","inicio"), iFin = buscar("terminodeproceso","termino");
  if(iProv < 0 || iIni < 0 || iFin < 0) throw new Error("faltan columnas clave");

  const hoy = new Date(); hoy.setHours(0,0,0,0);

  return filas.slice(iCab+1).map(f => {
    const nombre = (f[iProv] || "").trim();
    if(!nombre) return null;
    const ini = fecha(f[iIni]), fin = fecha(f[iFin]);
    if(!ini || !fin || fin < ini) return null;

    let estado;
    if(fin < hoy)      estado = "cerrado";
    else if(ini > hoy) estado = "programado";
    else               estado = "proceso";

    const leyTxt = (f[iLey] || "").trim();
    return {
      nombre,
      tipo:  (f[iTipo] || "").trim(),
      stock: num(f[iStock]),
      ley:   /sin\s*leyes/i.test(leyTxt) ? 0 : num(leyTxt),
      ini, fin, estado
    };
  }).filter(Boolean);
}

function pintarProcesos(procesos){
  const filas  = document.getElementById("filas");
  const escala = document.getElementById("escala");
  const nota   = document.getElementById("gantt-nota");

  const hoy = new Date(); hoy.setHours(0,0,0,0);
  const desde = new Date(hoy); desde.setDate(desde.getDate() - 7);

  // Ventana útil: lo que sigue vivo, más lo cerrado la semana pasada
  const vista = procesos.filter(p => p.fin >= desde)
                        .sort((a,b) => a.ini - b.ini)
                        .slice(0, CONFIG.PROCESOS_VISIBLES);

  if(!vista.length){
    escala.innerHTML = "";
    filas.innerHTML = '<div class="vacio"><b>Sin procesos programados</b>Revisa el programa de planta</div>';
    nota.textContent = "";
    return;
  }

  let ini = new Date(Math.min(desde, ...vista.map(p => +p.ini)));
  let fin = new Date(Math.max(hoy,  ...vista.map(p => +p.fin)));
  const span = Math.max(fin - ini, 864e5) * 1.02;
  const pos  = d => Math.max(0, Math.min(100, (d - ini) / span * 100));

  escala.innerHTML = Array.from({length:5}, (_,i) =>
    `<span>${dia(new Date(+ini + span*i/4))}</span>`).join("");

  filas.innerHTML = vista.map(p => {
    const izq = pos(p.ini), ancho = Math.max(pos(p.fin) - izq, 1.6);
    const dias = Math.max(1, Math.round((p.fin - p.ini)/864e5));
    const det  = [p.tipo, p.stock ? fmt(p.stock,0)+" TMH" : "", p.ley ? "ley "+fmt(p.ley,2) : ""]
                 .filter(Boolean).join(" · ");
    return `<div class="fila-proc">
      <div class="proc-id">
        <div class="p">${esc(p.nombre)}</div>
        <div class="s">${esc(det)}</div>
      </div>
      <div class="carril">
        <div class="barra ${p.estado}" style="left:${izq}%;width:${ancho}%">${dias} d</div>
      </div>
    </div>`;
  }).join("");

  const carril = filas.querySelector(".carril");
  if(carril && hoy >= ini && hoy <= fin){
    const marca = document.createElement("div"); marca.className = "hoy";
    const r = carril.getBoundingClientRect(), c = filas.getBoundingClientRect();
    marca.style.left = (r.left - c.left + r.width * pos(hoy)/100) + "px";
    filas.appendChild(marca);
  }

  const porProcesar = procesos.filter(p => p.fin >= hoy).reduce((s,p) => s + p.stock, 0);
  nota.textContent = porProcesar ? fmt(porProcesar,0) + " TMH por procesar" : "";
}

function animarBarras(){
  document.querySelectorAll(".pista i").forEach(b=>{ b.style.width=b.dataset.w+"%"; });
}

/* ════════════════════════════════════════════════════════════════
   5. Ciclo principal
   ════════════════════════════════════════════════════════════════ */
/* Los fragmentos de Kitco esperan DOMContentLoaded, que aquí ya ocurrió,
   así que cada widget se arranca al terminar de bajar su bundle. */
function cargarWidgetKitco({src, fns, contId, hostId, config}){
  const cont=document.getElementById(contId);
  if(!cont) return;

  const host=document.createElement("div");
  host.id=hostId;
  host.style.width="100%";
  host.style.height="100%";   // sin altura definida el widget se dibuja vacío
  cont.appendChild(host);

  const falla = msg =>{ cont.innerHTML='<div class="aviso">'+msg+'</div>'; };
  const fn = ()=> fns.map(n=>window[n]).find(f=>typeof f==="function");

  const arrancar = ()=>{
    const crear = fn();
    if(!crear) return falla("Kitco no expuso su función de arranque");
    try{
      crear(hostId, config);
      setTimeout(()=>{ if(!host.children.length) falla("Kitco no devolvió el widget"); },6000);
    }catch(e){ console.error(e); falla("No se pudo dibujar el widget de Kitco"); }
  };

  if(fn()) return arrancar();

  const s=document.createElement("script");
  s.src=src;
  s.onload=arrancar;
  s.onerror=()=>falla("Sin conexión con Kitco");
  document.head.appendChild(s);
}

function montarKitco(){
  // Gráfico de metales base, con cobre por defecto
  cargarWidgetKitco({
    src:"https://storage.googleapis.com/kitco-widgets-storage/widgetBaseMetalsCharts.bundle.js",
    fns:["createBaseMetalsChartsWidget"],
    contId:"mercado",
    hostId:"widget_base_metals_charts",
    config:{
      widgetId:"widget_base_metals_charts",
      width:"400",
      isTransparent:false,
      colorTheme:"light",
      defaultMetal:"CU",
      defaultTimeFrame:"24H"
    }
  });

  // Precios spot. Kitco nombra la función con un error de tipeo,
  // así que se aceptan las dos grafías por si algún día lo corrigen.
  cargarWidgetKitco({
    src:"https://storage.googleapis.com/kitco-widgets-storage/widgetSpotPrice.bundle.js",
    fns:["createSpotePriceWidget","createSpotPriceWidget"],
    contId:"mercado-spot",
    hostId:"widget_spot_price",
    config:{ width:300, isTransparent:false, colorTheme:"light" }
  });
}

function montarMercado(){
  const cont=document.getElementById("mercado");
  if(!cont || !CONFIG.MERCADO) return;

  if(CONFIG.MERCADO==="kitco") return montarKitco();

  if(CONFIG.MERCADO==="embebido"){
    const codigo=(CONFIG.CODIGO_EMBEBIDO||"").trim();
    if(!codigo) return;
    // innerHTML no ejecuta los <script> que traiga el fragmento,
    // así que hay que volver a crearlos para que corran.
    cont.innerHTML=codigo;
    cont.querySelectorAll("script").forEach(viejo=>{
      const nuevo=document.createElement("script");
      [...viejo.attributes].forEach(a=>nuevo.setAttribute(a.name,a.value));
      nuevo.text=viejo.textContent;
      viejo.replaceWith(nuevo);
    });
    return;
  }

  const caja=document.createElement("div");
  caja.className="tradingview-widget-container";
  caja.innerHTML='<div class="tradingview-widget-container__widget"></div>';
  const s=document.createElement("script");
  s.src="https://s3.tradingview.com/external-embedding/embed-widget-ticker-tape.js";
  s.async=true;
  s.text=JSON.stringify({
    symbols: CONFIG.SIMBOLOS,
    showSymbolLogo:false,
    colorTheme:"dark",
    isTransparent:true,
    displayMode:"regular",
    locale:"es"
  });
  caja.appendChild(s);
  cont.appendChild(caja);
}

function marcarSync(clase,texto){
  document.getElementById("punto").className="punto "+clase;
  document.getElementById("sync-txt").textContent=texto;
}

let ultimaCarga=null;

async function cargar(){
  // Las dos hojas se piden a la vez y fallan por separado: si una no
  // responde, la otra igual se pinta.
  const procesosProm = traerProcesos().catch(e=>{ console.warn("Procesos:",e.message); return null; });

  try{
    const lotes = armarLotes(await traerMaestro());
    const entregadas  = lotes.filter(l=>l.estado!=="programado");
    const programados = lotes.filter(l=>l.estado==="programado");

    pintarConsolidado(entregadas, programados);
    pintarProcedencia(entregadas);
    pintarMeses(entregadas);
    requestAnimationFrame(animarBarras);

    ultimaCarga=new Date();
    if(origenDatos==="jsonp") marcarSync("","Actualizado ahora · lectura directa");
    else                      marcarSync("","Actualizado ahora");
  }catch(err){
    console.error(err);
    marcarSync("error", ultimaCarga
      ? "Sin conexión · datos de "+ultimaCarga.toLocaleTimeString("es-PE",{hour:"2-digit",minute:"2-digit"})
      : "No se pudo leer el Sheet");
  }

  const procesos = await procesosProm;
  if(procesos) pintarProcesos(procesos);
  else document.getElementById("filas").innerHTML =
    '<div class="vacio"><b>Sin acceso al programa de planta</b>Revisa que la pestaña siga publicada</div>';
}

function tick(){
  const n=new Date();
  document.getElementById("reloj").textContent=n.toLocaleTimeString("es-PE",{hour:"2-digit",minute:"2-digit",hour12:false});
  document.getElementById("fecha").textContent=n.toLocaleDateString("es-PE",{weekday:"long",day:"numeric",month:"long"});
  if(ultimaCarga){
    const min=Math.floor((n-ultimaCarga)/60000);
    if(min>=1){
      // El origen manda: el respaldo no debe disfrazarse de lectura en vivo.
      if(origenDatos==="fallo") marcarSync("error","Sin datos · el Sheet no responde");
      else marcarSync("","Actualizado hace "+min+" min");
    }
  }
}

tick(); setInterval(tick,20000);
montarMercado();
cargar(); setInterval(cargar,CONFIG.REFRESCO_MIN*60000);
let t; window.addEventListener("resize",()=>{ clearTimeout(t); t=setTimeout(cargar,400); });
